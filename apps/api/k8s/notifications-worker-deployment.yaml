apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-worker
  template:
    metadata:
      labels:
        app: notifications-worker
    spec:
      containers:
        - name: notifications-worker
          image: erp-notifications-worker:latest
          envFrom:
            - configMapRef:
                name: erp-config
            - secretRef:
                name: erp-secrets
