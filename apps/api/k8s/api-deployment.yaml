apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-api
  labels:
    app: erp-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-api
  template:
    metadata:
      labels:
        app: erp-api
    spec:
      containers:
        - name: erp-api
          image: erp-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: erp-config
            - secretRef:
                name: erp-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: erp-api-service
spec:
  selector:
    app: erp-api
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-config
data:
  RABBITMQ_URL: "amqp://rabbitmq-service:5672"
  NODE_ENV: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: erp-secrets
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
